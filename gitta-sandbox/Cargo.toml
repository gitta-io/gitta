[package]
name = "gitta-sandbox"
version = "0.1.3"
edition = "2021"
description = "Run a coding agent in a world built from only its worktree and the toolchain, using unprivileged Linux namespaces (bubblewrap) with outbound-only networking"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "unwind"   # the MCP server catches tool panics with catch_unwind; "abort" would kill the session
incremental = false
overflow-checks = false
