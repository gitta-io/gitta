[package]
name = "gitta-sandbox"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gitta-io/gitta"
homepage = "https://gitta.io"
description = "Run a coding agent with default-deny filesystem (and optionally network) rights, enforced by the Linux kernel (Landlock)"

[dependencies]
landlock = "0.4"
globset = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "unwind"   # the MCP server catches tool panics with catch_unwind; "abort" would kill the session
incremental = false
overflow-checks = false
